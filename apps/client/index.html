<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="HBPlus Secure Access Portal - Cross-Platform Google Authentication with Exact Domain Restriction" />
    <title>HBPlus Secure Access Portal</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background: radial-gradient(1200px circle at 50% -10%, rgba(16, 185, 129, 0.09) 0%, rgba(248, 250, 252, 0.8) 60%),
                    radial-gradient(900px circle at 85% 85%, rgba(6, 182, 212, 0.04) 0%, rgba(248, 250, 252, 0) 70%),
                    #F8FAFC;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #0F172A;
      }

      /* Web-specific smooth transitions & focus rings */
      button, a, input {
        font-family: inherit;
        outline: none;
      }
      
      button:focus-visible {
        outline: 2px solid #10B981;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
